[package]
name = "nucleus-client"
version = "0.1.0"
edition = "2024"
description = "Native Omniverse Nucleus client library."
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
nucleus-transport = { version = "0.1.0", path = "../nucleus-transport" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[package.metadata.cargo-machete]
# `serde` is referenced from code emitted by the `nucleus-codegen`
# build-dependency. cargo-machete only walks `src/` and so flags it
# as unused.
ignored = ["serde"]

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
nucleus-codegen = { version = "0.1.0", path = "../nucleus-codegen" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
