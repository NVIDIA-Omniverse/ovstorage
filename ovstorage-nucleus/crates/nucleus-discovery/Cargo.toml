[package]
name = "nucleus-discovery"
version = "0.1.0"
edition = "2024"
description = "Native Omniverse Nucleus discovery library."
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
nucleus-transport = { version = "0.1.0", path = "../nucleus-transport" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[package.metadata.cargo-machete]
# `anyhow` and `serde` are referenced from code emitted by the
# `nucleus-codegen` build-dependency, not from `src/`. cargo-machete
# only walks `src/` and so flags them as unused. Keep them.
ignored = ["anyhow", "serde"]

[build-dependencies]
nucleus-codegen = { version = "0.1.0", path = "../nucleus-codegen" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
