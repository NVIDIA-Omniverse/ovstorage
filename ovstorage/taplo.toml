# Repo-wide TOML formatting config consumed by `taplo fmt`. CI runs
# `make fmt-toml-check` (taplo fmt --check); local devs run
# `make fmt-toml` to write the formatted output back.

include = ["**/*.toml"]
# `target/`, `dist/`, and `_archive/` are build/output trees, not source.
# `ovstorage-services/` is vendored source-of-truth and must not be reformatted
# in place. Everything else — root TOMLs, `.cargo/config.toml`, every crate
# `Cargo.toml`, and the Python crate's `pyproject.toml` — gets formatted.
exclude = ["**/target/**", "dist/**", "_archive/**", "ovstorage-services/**"]

[formatting]
# Modest knobs that read well on a 100-col terminal and keep
# inline tables compact.
align_entries = false
align_comments = true
array_trailing_comma = true
array_auto_expand = true
array_auto_collapse = true
column_width = 100
compact_arrays = true
compact_inline_tables = false
indent_string = "    "
trailing_newline = true
reorder_keys = false
reorder_arrays = false
