[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
httpdate = "1"
jsonwebtoken = "9"
pin-project-lite = "0.2"
opendal = { version = "0.50", default-features = false, features = [
    "services-fs",
    "services-http",
    "services-s3",
    "services-webdav",
] }
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
urlencoding = "2"

# Path dep on the core ovstorage workspace's plugin SPI. Local dev resolves
# through `path`; published consumers would use `version` only.
ovstorage-plugin = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-plugin" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
