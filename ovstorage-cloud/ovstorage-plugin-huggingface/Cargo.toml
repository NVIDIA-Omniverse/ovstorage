[package]
name = "ovstorage-plugin-huggingface"
version.workspace = true
edition = "2024"
description = "Read-only Hugging Face Hub ovstorage backend crate."
license = "Apache-2.0"

[dependencies]
ovstorage-plugin = { workspace = true }
async-trait = "0.1.89"
bytes = "1.11.1"
futures = "0.3.32"
httpdate = "1.0.3"
parking_lot = "0.12.5"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.47", features = ["parsing"] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
ovstorage = { workspace = true }
ovstorage-plugin-http = { workspace = true }
ovstorage-plugin-test = { workspace = true }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "test-util",
] }

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
