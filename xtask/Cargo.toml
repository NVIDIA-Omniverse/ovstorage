[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1"
cbindgen = "0.29"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
