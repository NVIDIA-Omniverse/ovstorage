[package]
name = "ovstorage-rest"
version.workspace = true
edition = "2024"
description = "Public REST/JSON gateway for ovstorage."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
async-channel = "2.5.0"
ovstorage = { workspace = true }
ovstorage-authz = { workspace = true }
ovstorage-authz-context = { workspace = true }
ovstorage-authz-layer = { workspace = true }
ovstorage-plugin = { workspace = true }
axum = "0.8.9"
figment = { version = "0.10.19", features = ["toml", "env"] }
metrics = "0.24.6"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "0.8.23"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
http-body-util = "0.1.3"
tower = "0.5.3"
base64 = "0.22.1"
bytes = "1.11.1"
jsonwebtoken = "9.3.1"
async-trait = "0.1.89"
# Streaming-seam test reuses `RecordingStreamFactory` /
# `assert_streaming_invariants` to verify the REST PUT body bridge
# propagates `Body::Stream` chunk-by-chunk from axum into the backend.
ovstorage-plugin-test = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ovstorage-rest"
path = "src/main.rs"

[lints]
workspace = true
