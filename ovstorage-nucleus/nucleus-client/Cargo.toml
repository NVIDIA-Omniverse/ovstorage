[package]
name = "nucleus-client"
version.workspace = true
edition = "2024"
description = "Native Omniverse Nucleus client library."
license = "Apache-2.0"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
nucleus-transport = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"

[package.metadata.cargo-machete]
# `serde` is referenced from code emitted by the `nucleus-codegen`
# build-dependency. cargo-machete only walks `src/` and so flags it
# as unused.
ignored = ["serde"]

[dev-dependencies]
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[build-dependencies]
nucleus-codegen = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
