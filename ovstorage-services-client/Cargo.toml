[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Plugin SPI (path during local dev; version pin for downstream publish)
ovstorage = { version = "0.1", path = "../ovstorage-core/crates/ovstorage" }
ovstorage-plugin = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-plugin" }

# Internal
ovstorage-services-protos = { version = "0.1.0", path = "crates/ovstorage-services-protos" }

# tonic 0.14 stack matches the upstream Omniverse Storage Service proto definitions
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "transport",
    "tls-ring",
    "tls-native-roots",
    "router",
] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"

async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower = "0.5"
tracing = "0.1"
url = "2"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
