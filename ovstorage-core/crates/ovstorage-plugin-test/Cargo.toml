[package]
name = "ovstorage-plugin-test"
version = "0.1.0"
edition = "2024"
description = "Configurable test backend plugin for ovstorage. Drives every edge case (redirects, multipart, auth flows, watch streams, error injection, retries) via connection-config knobs so host tests can cover dispatch shapes file/http plugins can't reach."
license = "Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
ovstorage-plugin = { version = "0.1.0", path = "../ovstorage-plugin" }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
ovstorage = { version = "0.1.0", path = "../ovstorage" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
