[package]
name = "ovstorage-rest"
version = "0.1.0"
edition = "2024"
description = "Public REST/JSON gateway for ovstorage."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
async-channel.workspace = true
async-trait.workspace = true
ovstorage.workspace = true
ovstorage-authz = { version = "0.1.0", path = "../ovstorage-authz" }
ovstorage-plugin.workspace = true
axum.workspace = true
figment.workspace = true
metrics.workspace = true
bytes.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
ovstorage-plugin-file.workspace = true
base64.workspace = true
# Streaming-seam test reuses `RecordingStreamFactory` /
# `assert_streaming_invariants` to verify the REST PUT body bridge
# propagates `Body::Stream` chunk-by-chunk from axum into the backend.
ovstorage-plugin-test = { version = "0.1.0", path = "../../../ovstorage-core/crates/ovstorage-plugin-test" }
reqwest = { workspace = true, features = ["stream"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ovstorage-rest"
path = "src/main.rs"

[lints]
workspace = true
