[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
arc-swap = "1"
async-channel = "2"
figment = { version = "0.10", features = ["toml", "env"] }
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
cbindgen = "0.29"
futures = "0.3"
futures-core = "0.3"
http-body-util = "0.1"
httpdate = "1"
libloading = "0.8"
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = [
    "http-listener",
] }
keyring = "3"
opentelemetry = { version = "0.31", features = ["metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "metrics",
] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
pin-project-lite = "0.2"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tracing = "0.1"
url = "2"

# Path deps on the core ovstorage workspace. Local dev resolves through
# `path`; published consumers would use `version` only.
ovstorage = { version = "0.1", path = "../ovstorage-core/crates/ovstorage" }
ovstorage-cache = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-cache" }
ovstorage-plugin = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-plugin" }
ovstorage-plugin-file = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-plugin-file" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
