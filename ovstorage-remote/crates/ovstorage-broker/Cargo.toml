[package]
name = "ovstorage-broker"
version = "0.1.0"
edition = "2024"
description = "Broker daemon for ovstorage brokered mode."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
arc-swap.workspace = true
async-channel.workspace = true
async-trait.workspace = true
ovstorage.workspace = true
ovstorage-authz = { version = "0.1.0", path = "../ovstorage-authz" }
ovstorage-authz-toml = { version = "0.1.0", path = "../ovstorage-authz-toml" }
ovstorage-broker-protocol = { version = "0.1.0", path = "../ovstorage-broker-protocol" }
ovstorage-cache.workspace = true
ovstorage-plugin.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
figment.workspace = true
futures.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
futures-core.workspace = true
httpdate.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["tls"] }
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
] }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
# Pin broker tests to single-threaded execution: see `tests/mod.rs`.
ctor = "0.4"
# Opt into ovstorage's test-only `auth::flow::test_support` module so
# the three-tier integration test can construct two `FakeIdp`s —
# one for app→broker, one for broker→upstream — without rolling its
# own HTTP fixture. Production broker builds leave this feature off.
ovstorage = { workspace = true, features = ["test-support"] }
# Three-tier test wires the keyring crate's in-process mock once at
# startup; the real OS keyring flakes under workspace test pressure.
keyring.workspace = true
# Streaming-seam tests reuse `RecordingStreamFactory` /
# `assert_streaming_invariants` to verify the broker gRPC write RPC
# propagates `Body::Stream` chunk-by-chunk above the buffered-Body
# threshold.
ovstorage-plugin-test = { version = "0.1.0", path = "../../../ovstorage-core/crates/ovstorage-plugin-test" }
# All backend access — production and tests — goes through the
# dlopen path via `with_test_plugins()`. The broker plugin is
# intentionally absent here: the broker reaches its
# `BrokerClientTransport` trait via `ovstorage-broker-protocol`,
# and tests dlopen the broker cdylib like every other
# plugin (see `with_test_plugins` in tests).

[lib]
path = "src/lib.rs"

[[bin]]
name = "ovstorage-broker"
path = "src/main.rs"

[lints]
workspace = true
