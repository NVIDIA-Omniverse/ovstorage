[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
anyhow = { version = "1", features = ["backtrace"] }
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "tracing-log"] }

# Path dep on the core ovstorage workspace's plugin SPI. Local dev resolves
# through `path`; published consumers would use `version` only.
ovstorage-plugin = { version = "0.1", path = "../ovstorage-core/crates/ovstorage-plugin" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
