language = "C"
include_guard = "OVSTORAGE_PLUGIN_H"
pragma_once = false
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "type"
# Emit `#ifdef __cplusplus` compatibility: extern "C" linkage guards
# around the function declarations and C++-valid fixed-underlying-type
# enums. Without this, a C++ translation unit including this header
# hits the C23 `enum ... : uint8_t` emulation (`enum X {...}; typedef
# uint8_t X;` redeclares `X` as a different type, a hard C++ error) and
# name-mangles the `ovstorage_plugin_*` declarations so they never
# match the C implementation.
cpp_compat = true

# Banner emitted at the top of the generated header. Helpful for reviewers
# who land on the generated file directly.
header = """/* SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
 * SPDX-License-Identifier: Apache-2.0
 *
 * ovstorage plugin C ABI.
 *
 * Generated by cbindgen from ovstorage-plugin/src/ffi.rs.
 * Do not edit by hand: edit the Rust source and rerun `cargo build` on the
 * crate. The build script regenerates this file in-place; the file is
 * checked in for code review and IDE consumption.
 */
"""

# Hand-emitted replacements for the `EffectivePermissions` associated
# constants. cbindgen cannot render them: the constants live on
# ovstorage-layer's tuple struct (`READ = Self(1 << 0)`, …) while the
# emitted C type is the named-field ffi shadow struct, so cbindgen finds
# no matching fields and emits empty `{ }` initializers (zero-valued,
# and ill-formed before C23). The Rust constants therefore carry
# `cbindgen:ignore` (ovstorage-layer/src/types.rs) and are re-emitted
# here as portable macros: plain unsigned `_BITS` values plus
# struct-typed value expressions (a C99 compound literal in C, an
# aggregate functional cast in C++ — a compound literal is not standard
# C++). Keep the bit values in lock-step with the Rust definitions.
# TOML literal string: the C line continuations must stay literal.
after_includes = '''
/** Well-known extension keys shared by hosts and auth Layer plugins. */
#define OVSTORAGE_EXT_AUTH_CREDENTIAL "org.omniverse.ovstorage/auth-credential@1"
#define OVSTORAGE_EXT_PRINCIPAL_ID "org.omniverse.ovstorage/principal@1"
#define OVSTORAGE_EXT_PRINCIPAL_DISPLAY_NAME "org.omniverse.ovstorage/principal-display-name@1"

/** `AuthCredential` flat-wire version and transport tag values. */
#define OVSTORAGE_AUTH_CREDENTIAL_WIRE_VERSION 2u
#define OVSTORAGE_AUTH_CREDENTIAL_TRANSPORT_TCP 0u
#define OVSTORAGE_AUTH_CREDENTIAL_TRANSPORT_UDS 1u
#define OVSTORAGE_AUTH_CREDENTIAL_TRANSPORT_NAMED_PIPE 2u

/**
 * `OvStoragePlugin_EffectivePermissions` bit values, mirroring the Rust
 * `EffectivePermissions` constants: `READ = 1 << 0`, `WRITE = 1 << 1`,
 * `DELETE = 1 << 2`, `UPDATE_METADATA = 1 << 3`. OR them into / test
 * them against the struct's `bits` field. Consumers ignore unknown bits
 * (forward-compat).
 */
#define OvStoragePlugin_EffectivePermissions_READ_BITS 0x1u
#define OvStoragePlugin_EffectivePermissions_WRITE_BITS 0x2u
#define OvStoragePlugin_EffectivePermissions_DELETE_BITS 0x4u
#define OvStoragePlugin_EffectivePermissions_UPDATE_METADATA_BITS 0x8u

/**
 * Struct-typed `OvStoragePlugin_EffectivePermissions` constants. Each
 * macro expands to a value expression of type
 * `OvStoragePlugin_EffectivePermissions` in both C (compound literal)
 * and C++ (aggregate functional cast).
 */
#ifdef __cplusplus
#define OvStoragePlugin_EffectivePermissions_READ \
  (OvStoragePlugin_EffectivePermissions{OvStoragePlugin_EffectivePermissions_READ_BITS})
#define OvStoragePlugin_EffectivePermissions_WRITE \
  (OvStoragePlugin_EffectivePermissions{OvStoragePlugin_EffectivePermissions_WRITE_BITS})
#define OvStoragePlugin_EffectivePermissions_DELETE \
  (OvStoragePlugin_EffectivePermissions{OvStoragePlugin_EffectivePermissions_DELETE_BITS})
#define OvStoragePlugin_EffectivePermissions_UPDATE_METADATA \
  (OvStoragePlugin_EffectivePermissions{OvStoragePlugin_EffectivePermissions_UPDATE_METADATA_BITS})
#else
#define OvStoragePlugin_EffectivePermissions_READ \
  ((OvStoragePlugin_EffectivePermissions){OvStoragePlugin_EffectivePermissions_READ_BITS})
#define OvStoragePlugin_EffectivePermissions_WRITE \
  ((OvStoragePlugin_EffectivePermissions){OvStoragePlugin_EffectivePermissions_WRITE_BITS})
#define OvStoragePlugin_EffectivePermissions_DELETE \
  ((OvStoragePlugin_EffectivePermissions){OvStoragePlugin_EffectivePermissions_DELETE_BITS})
#define OvStoragePlugin_EffectivePermissions_UPDATE_METADATA \
  ((OvStoragePlugin_EffectivePermissions){OvStoragePlugin_EffectivePermissions_UPDATE_METADATA_BITS})
#endif
'''

[parse]
# The repr(C) shadow types live under this crate's `ffi` module, but the
# migrated Rust vocabulary carries a few associated constants that cbindgen
# historically emitted into this header. Parse only `ovstorage-layer` among
# dependencies so those constants stay visible without broad dependency walks.
parse_deps = true
include = ["ovstorage-layer"]

[export]
# Every emitted type gets the `OvStoragePlugin_` prefix. The trailing
# underscore visually separates the project namespace from the type
# name (e.g. Rust `StreamStep` → C `OvStoragePlugin_StreamStep`). It
# survives now because no `rename_variants` rule is firing — earlier
# experiments with `rename_variants = "GeckoCase"` accidentally
# stripped the underscore via PascalCase normalization. The future
# `ovstorage.h` (library API header) will use a separate `OvStorage_`
# prefix so the two surfaces don't collide. Never abbreviate to
# `Ovs` / `OvsPlugin`.
#
# `[export] prefix` applies to types and constants. It does NOT
# apply to `#[no_mangle]` functions (their C name is fixed by the
# Rust function name), so every exported `ovstorage_plugin_*`
# function comes through verbatim.
prefix = "OvStoragePlugin_"

# Force cbindgen to emit the manifest/init types even though no
# `extern "C" fn` in the current source surface refers to them. The
# host loader looks them up by symbol from a `dlopen`'d plugin, so
# the C header still needs the layout. Without this list cbindgen's
# reachability pass would elide them.
include = [
    "PluginManifestV1",
    # Plugin authors typing `ovstorage_plugin_init_v1` need the host
    # callback parameter even though no emitted declaration reaches it.
    "HostCallbacks",
    "PluginVTableV1",
    "PluginInitResultV1",
    # Object-operation completion callbacks are erased to `void *result`, so
    # cbindgen cannot discover this concrete current result payload itself.
    "BackendItemInfo",
]

# An item present in `[export.rename]` is emitted with the listed C
# name instead of the `OvStoragePlugin`-prefixed form. With
# `renaming_overrides_prefixing = true`, mapping an identifier to
# itself opts that single item out of the project-wide prefix —
# used here to publish the current Layer ABI version under the concise
# C-facing name expected by plugin authors.
renaming_overrides_prefixing = true

[export.rename]
OVSTORAGE_PLUGIN_ABI_V2_VERSION = "OVSTORAGE_PLUGIN_ABI_VERSION"

[enum]
prefix_with_name = true
# `rename_variants = "GeckoCase"` would emit `eFooBar`-style variants in
# pure Mozilla style, but cbindgen 0.27 implements GeckoCase as
# PascalCase on the *already-joined* `<TypeName><Variant>` identifier,
# which strips the underscore `prefix_with_name` adds — so the result
# is camel-concat (`OvStoragePluginAuthEventTagOpenBrowser`) rather
# than the desired `OvStoragePluginAuthEventTag_eOpenBrowser`. Leaving
# the rule unset keeps the underscore separator and emits
# `OvStoragePluginAuthEventTag_OpenBrowser`, which is collision-safe
# under C's flat enum-value namespace and the closest stock cbindgen
# can get to the Gecko style. Reaching the literal `eFoo` form would
# need either a cbindgen patch or a build-script post-process pass.
