[package]
name = "ovstorage-plugin-s3"
version = "0.1.0"
edition = "2024"
description = "S3-compatible ovstorage backend crate."
license = "Apache-2.0"

[dependencies]
ovstorage-plugin.workspace = true
async-trait.workspace = true
hex.workspace = true
hmac.workspace = true
httpdate.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rust-ini.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# rust-ini's lib name is `ini`, so cargo-machete's package-name match misses
# its use in credentials.rs.
[package.metadata.cargo-machete]
ignored = ["rust-ini"]
