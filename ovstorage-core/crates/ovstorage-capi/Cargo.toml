[package]
name = "ovstorage-capi"
version = "0.1.0"
edition = "2024"
description = "C ABI for ovstorage."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
ovstorage = { version = "0.1.0", path = "../ovstorage" }
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
ovstorage = { version = "0.1.0", path = "../ovstorage" }
ovstorage-plugin-test = { version = "0.1.0", path = "../ovstorage-plugin-test" }
keyring.workspace = true
libloading.workspace = true

[build-dependencies]
cbindgen.workspace = true

# Cdylib output ships as `libovstorage.{so,dylib}` / `ovstorage.dll` so
# consumers `-lovstorage` matches the `ovstorage.h` header. The crate
# itself remains `ovstorage-capi` in workspace metadata. No rlib: the
# host `ovstorage` crate already has `[lib] name = "ovstorage"` (its
# package default) and having two rlibs by that name in `deps/` would
# break capi's own `use ovstorage` imports (E0464). The integration
# tests under `tests/` dlopen the cdylib instead of linking the rlib;
# the Makefile's `test-ci` target runs `cargo build --workspace` first
# so the cdylib is emitted before tests run (cargo's lib-as-test-bin
# path does not produce the cdylib output by itself).
[lib]
name = "ovstorage"
path = "src/lib.rs"
crate-type = ["cdylib"]
# capi's public surface is the cbindgen-generated C header, not rustdoc.
# `doc = false` keeps `cargo doc --workspace` from colliding with the
# host `ovstorage` crate's rustdoc output (both would emit to
# `target/doc/ovstorage/` otherwise).
doc = false

[lints]
workspace = true
