[package]
name = "ovstorage-cache"
version.workspace = true
edition = "2024"
description = "Local cache primitives for ovstorage."
license = "Apache-2.0"

[dependencies]
fs2 = "0.4.3"
async-trait = "0.1.89"
metrics = "0.24.6"
ovstorage-layer = { workspace = true }
parking_lot = "0.12.5"
rusqlite = { version = "0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "rt",
] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
# Pinned exactly: bench baselines and CI trend extraction read criterion's
# on-disk output layout, which is stable in practice but undocumented.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
fs2 = "0.4.3"
tempfile = "3.27.0"

[lib]
# `cargo bench` must not run the libtest lib harness: it rejects
# criterion-only CLI flags such as `--quick` and `--save-baseline`.
bench = false
path = "src/lib.rs"

[features]
# Exposes deterministic interposition hooks to dependent-crate tests. Production
# builds leave the hooks and their storage out entirely.
test-seams = []

# Criterion provides `main`; see the bench's module docs for what it prices.
[[bench]]
harness = false
name = "metadata"

[lints]
workspace = true
