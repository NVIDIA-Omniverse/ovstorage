language = "C"
include_guard = "OVSTORAGE_H"
pragma_once = false
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "type"
# Wrap function declarations in `extern "C"` when the header is
# included from a C++ translation unit. Without this, C++ name-mangles
# the declarations and link fails against the un-mangled cdylib
# symbols.
cpp_compat = true

# Banner emitted at the top of the generated header.
header = """/* SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
 * SPDX-License-Identifier: Apache-2.0
 *
 * ovstorage library C ABI.
 *
 * Generated by cbindgen from crates/ovstorage-capi/src/{lib.rs,ops.rs}.
 * Do not edit by hand: edit the Rust source and rerun `cargo build` on
 * the crate. The build script regenerates this file in-place; the file
 * is checked in for code review and IDE consumption.
 */
"""

[parse]
parse_deps = false

[export]
# Every emitted type gets the `OvStorage_` prefix to mirror the plugin
# crate's `OvStoragePlugin_` convention. Function names are NOT
# rewritten (cbindgen doesn't rename `#[no_mangle]` exports), so they
# stay snake_case (`ovstorage_stat`, `ovstorage_library_init`, …).
prefix = "OvStorage_"

# Force-include types that are only reachable behind opaque pointers
# (no `extern "C" fn` returns or accepts them by value), so cbindgen's
# reachability pass doesn't elide them. Names are the Rust source
# names; cbindgen applies the `OvStorage_` prefix on emit.
include = [
    "Status",
    "Error",
    "Library",
    "CancelToken",
    "Info",
    "LocalDelegate",
    "List",
    "VersionList",
    "UpdateMetadataOptions",
    "InitAuthSubstrateOptionsV1",
    "LibraryInitOptionsV1",
    "StatOptionsV1",
    "ReadOptionsV1",
    "WriteOptionsV1",
    "ListOptionsV1",
    "ListVersionsOptionsV1",
    "CreateDirectoryOptionsV1",
    "DeleteDirectoryOptionsV1",
    "AccessOps",
    "AccessDecision",
    "ObjectKind",
    "Bytes",
    "ConfigValue",
    "ConfigValueKind",
    "SecretValue",
    "ConnectionRequest",
    "AuthStrategy",
    "CapabilitiesV1",
    "ChangeKindSet",
    "VersionListOrder",
    "Connection",
    "ConnectionSourceKind",
    "ConfigLayer",
    "ConnectionAuthStateKind",
    "ConnectionCallback",
    "ConnectionList",
    "ConnectionListCallback",
    "SecretBundle",
    "AuthEvent",
    "AuthEventKind",
    "AuthEventCallback",
    "AddressVisibility",
    "AliasRequest",
    "Alias",
    "AliasList",
    "AliasSourceKind",
    "AliasStateKind",
    "AliasCallback",
    "AliasListCallback",
    "AddressVisibilityOverride",
    "AddressVisibilityOverrideList",
    "AddressRoot",
    "AddressRootList",
    "BackendKindDescriptor",
    "BackendKindDescriptorList",
    "RouteSourceKind",
    "AddressVisibilityOverrideCallback",
    "AddressVisibilityOverrideListCallback",
    "AddressRootListCallback",
    "BackendKindDescriptorListCallback",
    "CapabilitiesCallback",
]

[enum]
prefix_with_name = true
