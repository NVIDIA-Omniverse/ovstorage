    patch:
      summary: Update Durable Queue
      description: Updates the filtering on an existing durable queue that was created
        using CreateDurableQueue. The filters will be updated without losing messages.
        This may be preferable to deleting and re-creating the durable queue, which
        may result in lost messages.
      operationId: update_durable_queue_api_v1beta_queues_durable_patch
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDurableQueueRequest'
      responses:
