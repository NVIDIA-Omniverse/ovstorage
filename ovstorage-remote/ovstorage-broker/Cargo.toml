[package]
name = "ovstorage-broker"
version.workspace = true
edition = "2024"
description = "Broker daemon for ovstorage brokered mode."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
arc-swap = "1.9.1"
async-channel = "2.5.0"
async-trait = "0.1.89"
ovstorage = { workspace = true }
# Attribution plus the shared `Principal` value type. Authorization is the
# in-stack `BuiltinAuthLayer`.
ovstorage-authz = { workspace = true }
ovstorage-authz-context = { workspace = true }
ovstorage-authz-layer = { workspace = true }
ovstorage-broker-protocol = { workspace = true }
ovstorage-cache = { workspace = true }
ovstorage-plugin = { workspace = true }
ovstorage-plugin-cache = { workspace = true }
ovstorage-plugin-core = { workspace = true }
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.11.1"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.32"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.16.2", default-features = false, features = [
    "http-listener",
] }
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
] }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics"] }
futures-core = "0.3.32"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
rustls-pki-types = { version = "1.14.1", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.18", features = ["sync", "net"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
toml = "0.8.23"
tonic = { version = "0.12.3", features = ["tls"] }
tracing = "0.1.44"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"
# Pin broker tests to single-threaded execution: see `tests/mod.rs`.
ctor = "0.4.3"
# Opt into ovstorage's test-only `auth::flow::test_support` module so
# the three-tier integration test can construct two `FakeIdp`s —
# one for app→broker, one for broker→upstream — without rolling its
# own HTTP fixture. Production broker builds leave this feature off.
ovstorage = { workspace = true, features = ["test-support"] }
# Streaming-seam tests reuse `RecordingStreamFactory` /
# `assert_streaming_invariants` to verify the broker gRPC write RPC
# propagates `Body::Stream` chunk-by-chunk above the buffered-Body
# threshold.
ovstorage-plugin-test = { workspace = true }
ovstorage-plugin-http = { workspace = true }
# All backend access — production and tests — goes through the
# dlopen path via `with_test_plugins()`. The broker plugin is
# intentionally absent here: the broker reaches its
# `BrokerClientTransport` trait via `ovstorage-broker-protocol`,
# and tests dlopen the broker cdylib like every other
# plugin (see `with_test_plugins` in tests).

[lib]
path = "src/lib.rs"

[[bin]]
name = "ovstorage-broker"
path = "src/main.rs"

[lints]
workspace = true
