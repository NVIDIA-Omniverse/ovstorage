[package]
name = "ovstorage-plugin-azure"
version.workspace = true
edition = "2024"
description = "Azure Blob Storage ovstorage backend crate."
license = "Apache-2.0"

[dependencies]
ovstorage-plugin = { workspace = true }
async-trait = "0.1.89"
base64 = "0.22.1"
parking_lot = "0.12.5"
flate2 = "1.1.9"
hmac = "0.12.1"
httpdate = "1.0.3"
quick-xml = { version = "0.36.2", features = ["serialize"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
urlencoding = "2.1.3"

[dev-dependencies]
ovstorage-plugin-test = { workspace = true }
# The cleartext-endpoint warning IS the operator-facing signal for every
# configuration the policy allows, so `cleartext.rs` asserts on the emitted
# event rather than on a side effect that happens to accompany it.
tracing-subscriber = { version = "0.3.23", features = ["registry"] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "test-util",
] }

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
