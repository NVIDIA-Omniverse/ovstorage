[package]
name = "ovstorage"
version = "0.1.0"
edition = "2024"
description = "ovstorage dispatcher and public Rust library."
license = "Apache-2.0"
build = "build.rs"

[dependencies]
ovstorage-cache = { version = "0.1.0", path = "../ovstorage-cache" }
ovstorage-plugin = { version = "0.1.0", path = "../ovstorage-plugin" }
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
crc32c.workspace = true
figment.workspace = true
fs2.workspace = true
futures.workspace = true
keyring.workspace = true
libloading.workspace = true
log.workspace = true
md-5.workspace = true
metrics.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[package.metadata.cargo-machete]
# `md-5` exposes its module as `md5` (the dep name has a dash, the
# module name does not). cargo-machete v0.9.1 doesn't follow the
# rename without `--with-metadata` and flags it as unused. Used at
# `src/redirect.rs:216,263`.
ignored = ["md-5"]

[dev-dependencies]
ovstorage-plugin-test = { version = "0.1.0", path = "../ovstorage-plugin-test" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = "0.6"

[features]
# `test-support` exposes `auth::flow::test_support::FakeIdp` (an
# in-process fake OAuth IdP) so downstream test crates — notably
# `ovstorage-broker`'s three-tier integration test — can drive both
# hops of an upstream-OAuth flow without a real network IdP.
# Production builds leave this off; the production surface stays
# clean of the fake-IdP HTTP server.
test-support = []

[lib]
path = "src/lib.rs"

[lints]
workspace = true
