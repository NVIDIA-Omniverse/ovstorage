[package]
name = "ovstorage-mcp"
version.workspace = true
edition = "2024"
description = "MCP stdio server exposing ovstorage tools."
license = "Apache-2.0"
publish = false

[[bin]]
name = "ovstorage-mcp"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
base64 = "0.22.1"
ovstorage = { workspace = true }
ovstorage-cli = { workspace = true }
ovstorage-envelope = { workspace = true }
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "tracing-log"] }

[dev-dependencies]
rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
    "client",
    "transport-child-process",
] }
tempfile = "3.27.0"
ovstorage-plugin-core = { workspace = true }
ovstorage-plugin-http = { workspace = true }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "process",
] }

[lints]
workspace = true
