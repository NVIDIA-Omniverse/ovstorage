[tool.poetry]
name = "omniverse-storageapi-conformance-tests"
version = "1.0.0b4"
description = "Conformance test-suite to validate a Storage API implementation"
authors = ["NVIDIA CORPORATION & AFFILIATES"]
license = "LicenseRef-NvidiaProprietary"
keywords = ["storage", "filesystem", "grpc", "rest", "api", "nvidia", "omniverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    {include = "conformance_tests", from = "src"},
    {include = "nvidia", from = "src"},
]
# Have to override the .gitignore rule for the generated protoc output. Poetry otherwise will ignore these files
include = [{ path = 'src/nvidia', format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = ">=1.80.0"
grpcio-tools = ">=1.80.0"
grpcio-reflection = ">=1.80.0"
googleapis-common-protos = ">=1.74.0"
fastapi = ">=0.136.0"
pydantic = ">=2.13.2"
uvicorn = ">=0.44.0"
PyYAML = ">=6.0.3"
typer = ">=0.24.1"
psutil = ">=7.2.2"
types-toml = ">=0.10.8"
types-PyYAML = ">=6.0.12"
types-requests = ">=2.33.0"
types-protobuf = ">=6.32.1,<7.0.0"
lxml = ">=6.1.0"
pytest = ">=9.0.3"
pytest-bdd = ">=8.1.0"
pytest-xdist = ">=3.8.0"
requests = ">=2.33.1"
mypy = ">=1.20.1"
mypy-gitlab-code-quality = ">=1.3.0"
pytest-dotenv = ">=0.5.2"
pytest-cov = ">=7.1.0"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1"
isort = ">=8.0.1"
pre-commit = ">=4.5.1"
myst-parser = ">=4.0.1"
boto3 = ">=1.42.91"
sphinx-markdown-builder = ">=0.6.10"

[tool.poetry.scripts]
run-conformance-tests = "conformance_tests:run_tests"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
