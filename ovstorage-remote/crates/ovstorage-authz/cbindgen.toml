language = "C"
include_guard = "OVSTORAGE_AUTHZ_PLUGIN_H"
pragma_once = false
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "both"

header = """/* SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
 * SPDX-License-Identifier: Apache-2.0
 *
 * ovstorage authz-plugin C ABI.
 *
 * Generated by cbindgen from crates/ovstorage-authz/src/ffi.rs.
 * Do not edit by hand: edit the Rust source and rerun `cargo build` on
 * the crate. The build script regenerates this file in-place; the file
 * is checked in for code review and IDE consumption.
 *
 * Authz plugins reuse the manifest + init + primitive types from the
 * storage plugin C ABI in `ovstorage_plugin.h` (PluginManifestV1,
 * PluginInitResultV1, OVSTORAGE_PLUGIN_ABI_VERSION, Str, List, Optional,
 * KeyValueList, ConfigValue, Error, CancelTokenFFI). The host
 * disambiguates an authz cdylib from a backend cdylib via
 * `PluginManifestV1::plugin_kind`.
 *
 * Input ownership contract for vtable methods: every `const *` input
 * parameter transfers ownership from host to plugin at the moment of
 * the call. The plugin MUST consume each input synchronously before
 * returning (typically via `memcpy`/deep-copy into plugin-owned
 * storage), because the host considers the inputs gone the instant
 * the vtable function returns and will not free them. Holding an
 * input pointer across an async boundary is undefined behavior. The
 * plugin signals completion by invoking `on_complete(status, result,
 * error, user_data)` exactly once; `result` and `error` ownership
 * transfer from plugin to host on that callback.
 */

/* The preamble (storage-SPI include + manual `List<AuthzDecisionV1>`
 * monomorphization) sits outside cbindgen's main `OVSTORAGE_AUTHZ_PLUGIN_H`
 * guard, so it needs its own guard to stay idempotent under repeated
 * `#include` of this header. Without it, the typedef below would be
 * re-emitted on every include and trip a C `conflicting types` error. */
#ifndef OVSTORAGE_AUTHZ_PLUGIN_PREAMBLE_H
#define OVSTORAGE_AUTHZ_PLUGIN_PREAMBLE_H

#include <stddef.h>
#include \"ovstorage_plugin.h\"

/* Local concrete instantiation of `List<AuthzDecisionV1>`. cbindgen
 * runs with `parse_deps = false` and cannot monomorphize the generic;
 * it sees the Rust alias `ListAuthzDecisionV1` as an opaque named
 * type and `[export.rename]` redirects every reference to the typedef
 * declared here. Layout matches the storage SPI's `List<T>` (ptr +
 * len). `style = \"both\"` emits the decision struct as
 * `typedef struct OvStorageAuthzPlugin_AuthzDecisionV1 { ... }
 * OvStorageAuthzPlugin_AuthzDecisionV1;`, so the forward struct tag
 * below is consistent with the later definition. */
struct OvStorageAuthzPlugin_AuthzDecisionV1;
typedef struct {
  struct OvStorageAuthzPlugin_AuthzDecisionV1 *ptr;
  size_t len;
} OvStorageAuthzPlugin_List_AuthzDecisionV1;

#endif /* OVSTORAGE_AUTHZ_PLUGIN_PREAMBLE_H */
"""

[parse]
parse_deps = false

[export]
prefix = "OvStorageAuthzPlugin_"

include = [
    "AuthzPluginVTableV1",
    "AuthzPluginInitResultV1",
    "AuthzRequestV1",
    "AuthzDecisionV1",
    "PrincipalV1",
    "AuthzEffectFFI",
]

# Imported types from ovstorage-plugin: don't re-emit (the included
# `ovstorage_plugin.h` defines them). The local `pub type` aliases for
# generic instantiations are excluded so cbindgen doesn't emit broken
# `typedef OvStorageAuthzPlugin_Optional<...>` definitions; references
# to those aliases land on the storage SPI's monomorphized typedefs
# via `[export.rename]`. `ListAuthzDecisionV1` is excluded because it
# is stamped manually in the header preamble above.
exclude = [
    "Str",
    "Error",
    "KeyValueList",
    "CancelTokenFFI",
    "VTableDropFn",
    "ConnectionConfigEntry",
    "List",
    "Optional",
    "ListAuthzDecisionV1",
    "OptionalStr",
    "OptionalI64",
    "OptionalU64",
    "ListStr",
    "ListConnectionConfigEntry",
]

renaming_overrides_prefixing = true

[export.rename]
OVSTORAGE_AUTHZ_PLUGIN_ABI_VERSION = "OVSTORAGE_AUTHZ_PLUGIN_ABI_VERSION"
Str = "OvStoragePlugin_Str"
Error = "OvStoragePlugin_Error"
KeyValueList = "OvStoragePlugin_KeyValueList"
CancelTokenFFI = "OvStoragePlugin_CancelTokenFFI"
VTableDropFn = "OvStoragePlugin_VTableDropFn"
ConnectionConfigEntry = "OvStoragePlugin_ConnectionConfigEntry"
OptionalStr = "OvStoragePlugin_Optional_Str"
OptionalI64 = "OvStoragePlugin_Optional_i64"
OptionalU64 = "OvStoragePlugin_Optional_u64"
ListStr = "OvStoragePlugin_List_Str"
ListConnectionConfigEntry = "OvStoragePlugin_List_ConnectionConfigEntry"
ListAuthzDecisionV1 = "OvStorageAuthzPlugin_List_AuthzDecisionV1"

[enum]
prefix_with_name = true
