[package]
name = "check-plugin-deps"
version.workspace = true
edition = "2024"
description = "Layering lint that forbids ovstorage plugin crates from depending on host-side ovstorage crates."
license = "Apache-2.0"
publish = false

[dependencies]
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "check-plugin-deps"
path = "src/main.rs"

[lints]
workspace = true
