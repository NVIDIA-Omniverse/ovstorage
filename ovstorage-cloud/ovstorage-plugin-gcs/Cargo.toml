[package]
name = "ovstorage-plugin-gcs"
version.workspace = true
edition = "2024"
description = "Google Cloud Storage ovstorage backend crate."
license = "Apache-2.0"

[dependencies]
ovstorage-plugin = { workspace = true }
async-trait = "0.1.89"
parking_lot = "0.12.5"
base64 = "0.22.1"
futures = "0.3.32"
hex = "0.4.3"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
ovstorage = { workspace = true }
ovstorage-plugin-http = { workspace = true }
ovstorage-plugin-test = { workspace = true }
base64 = "0.22.1"
http = "1.4.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "test-util",
] }

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
