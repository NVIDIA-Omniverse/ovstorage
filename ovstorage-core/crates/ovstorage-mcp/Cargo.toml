[package]
name = "ovstorage-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP stdio server exposing ovstorage tools."
license = "Apache-2.0"
publish = false

[[bin]]
name = "ovstorage-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
ovstorage = { version = "0.1.0", path = "../ovstorage" }
ovstorage-cache = { version = "0.1.0", path = "../ovstorage-cache" }
ovstorage-cli = { version = "0.1.0", path = "../ovstorage-cli" }
ovstorage-envelope = { version = "0.1.0", path = "../ovstorage-envelope" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber.workspace = true

[dev-dependencies]
ovstorage-plugin-file = { version = "0.1.0", path = "../ovstorage-plugin-file" }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }

[lints]
workspace = true
