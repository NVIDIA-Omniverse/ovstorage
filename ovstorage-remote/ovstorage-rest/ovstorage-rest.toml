# ovstorage REST gateway — default configuration.
#
# The gateway builds its shared inner data-plane Stack directly from the
# `[ovstorage]` table below through `ovstorage::host::build_stack`: the layer
# graph is layer config here, not a host concern. The per-listener built-in auth
# layer is attached over this inner from `[server].auth`.
#
# Copy and edit: point the `file` connection `root` at your data directory. The
# gateway refuses to start with an empty `[ovstorage.layers]` — declare a stack
# or copy this file.

# Trust-boundary attribution for `modified_by`: `user_metadata` (default) stamps
# the authenticated principal; `passthrough` forwards an upstream broker's stamp
# when this gateway fronts another broker. Top-level key: read by `RestConfig`,
# NOT `[server]` — keep it above the first table header so TOML does not nest it.
#
# The strategy is process-wide: every `attribution` layer in the graph below is
# built from this one value, so branches differ by whether they declare the layer
# at all, never by how it behaves.
attribution_strategy = "user_metadata"

# Whether a redirect carrying a credential broader than the redirected request
# may be handed to the client that asked for it. Top-level key, like
# `attribution_strategy` — keep it above the first table header.
#
# This is a property of the deployment, not of the credential. A gateway is not
# always a credential boundary: it is sometimes a central configuration point
# for clients already inside the trust boundary, and handing those clients a
# credential discloses nothing they were not already entitled to, while refusing
# costs them the redirect path entirely. Only you can say which this is.
#
# `refuse` (default) — such a redirect is not surfaced as a `307`; the follower
#   below fetches the object and the gateway streams the bytes instead.
# `allow` — any valid redirect may be surfaced as a `307`.
#
# Either way, a redirect whose credential is scoped to the redirected request —
# an S3 presigned URL, an Azure service SAS the gateway minted, a GCS signed URL
# — is surfaced. Those are the reason redirects exist.
#
# A `307` carries the redirect URL and no request headers, so what this setting
# withholds here is a credential riding in the URL's query — an
# operator-supplied Azure `sas_token`, for one.
#
# In effect this is a read setting on the gateway: REST surfaces no write
# redirect at all, since a body-bearing PUT is followed server-side. The broker
# spells the key the same way and means the same thing by it, and there it
# governs writes as well.
redirect_credential_disclosure = "refuse"

# Single listener. Auth is FAIL-CLOSED: an absent `auth` refuses to start,
# forcing a conscious choice — so no allow-all default ships.
[server]
listen = "127.0.0.1:8080"
# Uncomment exactly one to enable auth:
#   auth = "anonymous"          # unauthenticated allow-all — dev / local only
# or a gating `[server.auth]` table (`builtin-auth` policy, OIDC `jwt_*`, ...):
#   auth = "builtin-auth"
#   [server.auth]
#   # policy rules, jwt_issuer / jwt_audience / jwt_jwks_url, ...

# --- The shared inner data-plane Stack -------------------------------------
#
# alias → copy_rename_fallback →
# redirect_follower(follow_reads=false) → router → attribution_file → file
#
# No caches, no retry (HTTP clients retry). `follow_reads = false` is
# REST-critical: a backend read redirect flows up unfollowed so the handler
# surfaces it as HTTP 307. Body-bearing writes still follow server-side.
#
# Attribution sits BELOW the router, one instance per branch. Two things follow
# from that placement, and both are why it is there:
#
#   * `copy_rename_fallback` emulates a copy or rename by fabricating a write and
#     issuing it downward. A branch-level attribution layer is in that write's
#     path, so an emulated copy stamps its destination.
#   * A branch whose backend cannot carry a `user_metadata` key omits the layer,
#     so the gateway never manufactures metadata that backend must refuse.
#     Declare the layer on `file`, `s3`, `gcs`, `azure`,
#     `omniverse-storage-service` and `broker` branches; omit it on `nucleus` (which rejects non-empty
#     `user_metadata`), `opendal` (which rejects it on presigned writes, and on
#     ordinary writes whenever the connection's driver cannot store it) and
#     `http` (read-only).
#
# A branch without the layer also gets no harvest and no inbound sanitizing: a
# reserved `ovstorage-*` key already stored on one of its objects surfaces to
# clients verbatim in `user_metadata` rather than being promoted to the typed
# `modified_by` and hidden, and a client-supplied value for the reserved key
# reaches that backend unaltered. On that branch it stays a raw `user_metadata`
# entry and `modified_by` reports whatever the backend natively knows, if
# anything.
#
# That does NOT stay on the branch. A `broker` branch carries the layer — so an
# upstream stamp survives a chain — and harvests whatever the host beneath it
# returned, so a value planted on an unsanitized branch of an upstream broker is
# promoted into the attested `modified_by` when read through a broker fronting
# it. `modified_by` from a chained broker is only as trustworthy as the
# sanitizing on every branch beneath it. On `nucleus` and `http` none of this
# happens at all: neither stores nor returns user metadata. On `opendal` it does,
# over a driver that persists metadata.
[ovstorage]
root = "alias"

# Credential-less address rewrites + visibility overrides (none by default).
[ovstorage.layers.alias]
inner = "copy_rename_fallback"

# Copy/rename staging for transfers the layer below declines.
[ovstorage.layers.copy_rename_fallback]
inner = "redirect_follower"

# Single global follower. `follow_reads = false` surfaces read redirects as
# HTTP 307 rather than following them server-side.
#
# DoS note: the wrapper default is `follow_reads = true` with NO size cap, which
# fetches redirect targets of any size. The bytes are streamed rather than
# buffered, so the cost is a held connection and bandwidth rather than gateway
# memory, and unbounded cache disk where a `byte_cache` sits above. This file
# pins `follow_reads = false` (307 surfacing) so that never applies. If you set
# `follow_reads = true` here, `follow_reads_max_bytes` bounds each fetch — but
# weigh it: an object above the cap, AND any object whose size the origin does
# not declare, takes the unfollowed arm instead, which is what makes a
# requester-pays read fail. Capped and uncapped are both deliberate choices with
# a named cost; see docs/public/broker-operator/README.md.
[ovstorage.layers.redirect_follower]
inner = "router"
follow_reads = false

# Forks to one branch per connected kind. A branch is the backend Layer itself
# (`target = kind`), or an attribution wrapper over it — the router resolves a
# child by the targets that child owns, and a wrapper reports its inner's.
[ovstorage.layers.router]
children = ["attribution_file"]

# Gateway-attested `modified_by` overlay for the `file` branch (strategy from the
# top-level `attribution_strategy`).
[ovstorage.layers.attribution_file]
kind = "attribution"
inner = "file"

[ovstorage.layers.file]
kind = "file"

# One connection per backend. The `file` backend roots at a local directory.
[[ovstorage.connections]]
backend_kind = "file"
display_name = "local files"

[ovstorage.connections.config]
root = "/srv/ovstorage/data"
