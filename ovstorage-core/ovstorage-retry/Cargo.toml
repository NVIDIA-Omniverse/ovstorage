publish = false

[dependencies]
metrics = "0.24.6"
ovstorage-layer = { workspace = true }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["time"] }
tracing = "0.1.44"

[lints]
workspace = true
