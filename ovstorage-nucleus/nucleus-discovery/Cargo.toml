[package]
name = "nucleus-discovery"
version.workspace = true
edition = "2024"
description = "Native Omniverse Nucleus discovery library."
license = "Apache-2.0"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
nucleus-transport = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"

[package.metadata.cargo-machete]
# `anyhow` and `serde` are referenced from code emitted by the
# `nucleus-codegen` build-dependency, not from `src/`. cargo-machete
# only walks `src/` and so flags them as unused. Keep them.
ignored = ["anyhow", "serde"]

[build-dependencies]
nucleus-codegen = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
