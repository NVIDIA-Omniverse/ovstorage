[workspace]
resolver = "2"
default-members = [
    "crates/ovstorage-plugin",
    "crates/ovstorage-plugin-macros",
    "crates/ovstorage",
    "crates/ovstorage-plugin-file",
    "crates/ovstorage-plugin-test",
    "crates/ovstorage-cli",
    "crates/ovstorage-envelope",
    "crates/ovstorage-mcp",
    "crates/ovstorage-capi",
    "crates/ovstorage-capi-cc-test",
    "crates/ovstorage-python",
    "crates/ovstorage-plugin-http",
    "crates/ovstorage-cache",
]
members = [
    "crates/ovstorage-plugin",
    "crates/ovstorage",
    "crates/ovstorage-plugin-file",
    "crates/ovstorage-plugin-test",
    "crates/ovstorage-cli",
    "crates/ovstorage-envelope",
    "crates/ovstorage-mcp",
    "crates/ovstorage-capi",
    "crates/ovstorage-capi-cc-test",
    "crates/ovstorage-python",
    "crates/ovstorage-plugin-http",
    "crates/ovstorage-cache",
    "examples/plugin-rust",
    "tools/check-plugin-deps",
]

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
cbindgen = "0.29"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
figment = { version = "0.10", features = ["toml", "env"] }
fs2 = "0.4"
futures = "0.3"
http-body-util = "0.1"
httpdate = "1"
inquire = "0.7"
# Explicit OS-native features: without them, keyring v3 defaults to MockCredential (in-memory, process-local) and warm-continuation silently breaks.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
libloading = "0.8"
log = "0.4"
md-5 = "0.10"
metrics = "0.24"
pin-project-lite = "0.2"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
parking_lot = "0.12"
pyo3 = { version = "0.21", features = [
    "abi3-py310",
    "extension-module",
    "generate-import-lib",
    "multiple-pymethods",
] }
pyo3-async-runtimes = { version = "0.21", features = ["tokio-runtime"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "blocking",
] }
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint"] }
rustyline = "14"
rmcp = { version = "0.16", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `serde_json` is workspace-shared so the test plugin's `__test_meta/` JSON
# introspection paths and any test asserting their shape pull the same version.
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "tracing-log"] }
url = "2"
webbrowser = "1"
zeroize = "1"

# C ABI stability: a panic crossing the FFI boundary is undefined
# behavior. Force the workspace to abort on panic so an escaped panic
# in a plugin or host callback terminates rather than rolling up the
# C frame stack. `catch_unwind` walls at each FFI entry point are
# defense in depth; this profile is the harder guarantee.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
