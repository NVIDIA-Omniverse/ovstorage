  /api/v1beta/queues/durable:
    post:
      summary: Create Durable Queue
      description: Creates a durable queue which will immediately begin receiving
        and queuing up messages for later consumption. The durable queue will exist
        until it is explicitly deleted with a call to the DeleteDurableQueue endpoint.
        A config object will be returned that includes an ID that must be reused as
        an argument in all future ConsumeDurableEvents calls.
      operationId: create_durable_queue_api_v1beta_queues_durable_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDurableQueueRequest'
      responses:
        '200':
          description: Queue created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDurableQueueResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized - The request requires valid authentication credentials.
            This typically indicates a missing, invalid, or expired authentication
            token.
          content:
            application/json:
              schema:
                description: Standard error response model for API governance.
                properties:
                  detail:
                    description: Error details
                    maxLength: 1024
                    title: Detail
                    type: string
                required:
                - detail
                title: ErrorResponse
                type: object
        '403':
          description: Forbidden - The authenticated user does not have permission
